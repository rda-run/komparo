name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Verify Dependencies
      run: go mod tidy && git diff --exit-code

    - name: Build
      run: make build

    - name: Test
      run: make test

    - name: Lint
      # Note: requires golangci-lint or just standard go tools depending on setup
      run: make lint
